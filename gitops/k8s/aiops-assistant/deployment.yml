# Kira (aiops-assistant) Streamlit UI.
# AWS access via EKS Pod Identity (role eks-cluster-aiops-assistant, Terraform).
# The kira-auth Secret (APP_PASSWORD) is created out-of-band, not stored in git:
#   kubectl create secret generic kira-auth -n boutique --from-literal=APP_PASSWORD=<password>
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiops-assistant
  namespace: boutique
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-assistant
  namespace: boutique
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiops-assistant
  template:
    metadata:
      labels:
        app: aiops-assistant
    spec:
      serviceAccountName: aiops-assistant
      containers:
        - name: aiops-assistant
          image: 955510722779.dkr.ecr.us-east-1.amazonaws.com/aiops-assistant:7b60f3c5f4b45500e67283bf168148710806e815
          ports:
            - containerPort: 8501
          env:
            - name: AWS_REGION
              value: us-east-1
            - name: BEDROCK_MODEL_ID
              value: us.anthropic.claude-sonnet-4-6
            # fetch_metrics / fetch_service_health run in this pod and query Prometheus privately
            - name: PROMETHEUS_URL
              value: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
            # Guardrails (#7): per-question token budget, per-session question rate limit
            - name: KIRA_MAX_TOKENS_PER_QUESTION
              value: "100000"
            - name: KIRA_MAX_QUESTIONS_PER_WINDOW
              value: "10"
            - name: KIRA_RATE_WINDOW_SECONDS
              value: "300"
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kira-auth
                  key: APP_PASSWORD
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: aiops-assistant
  namespace: boutique
spec:
  selector:
    app: aiops-assistant
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8501
  type: LoadBalancer
