# Kira's write tools (#8): scale, restart, and roll back the boutique app
# deployments, only after an engineer approves each action in the UI.
# resourceNames must match ALLOWED_DEPLOYMENTS in projects/aiops-assistant/guardrails.py.
# Not included: aiops-assistant itself and Postgres.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aiops-assistant-remediation
  namespace: boutique
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    resourceNames: [auth, frontend, gateway, order-service, orders, product-service, user-service]
    verbs: ["get", "patch"]
  # rollout progress check after an action
  - apiGroups: ["apps"]
    resources: ["deployments/status"]
    resourceNames: [auth, frontend, gateway, order-service, orders, product-service, user-service]
    verbs: ["get"]
  # rollback reads the previous revision's ReplicaSet (list can't be limited by name)
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiops-assistant-remediation
  namespace: boutique
subjects:
  - kind: ServiceAccount
    name: aiops-assistant
    namespace: boutique
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aiops-assistant-remediation
---
# Kira's fetch_recent_changes tool (#10): read-only events and deployments.
# The Argo CD Application read (argocd namespace) is in Terraform,
# projects/Infrastructure/modules/argocd/main.tf, because this kustomization
# sets every resource's namespace to boutique.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aiops-assistant-read
  namespace: boutique
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiops-assistant-read
  namespace: boutique
subjects:
  - kind: ServiceAccount
    name: aiops-assistant
    namespace: boutique
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aiops-assistant-read
