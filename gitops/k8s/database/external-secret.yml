# DB credentials come from AWS Secrets Manager (boutique/db, created by Terraform)
# via External Secrets Operator, which reads it with its IRSA role.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: boutique
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: boutique-secrets
  namespace: boutique
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: boutique-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        POSTGRES_DB: postgres
        POSTGRES_USER: "{{ .username }}"
        POSTGRES_PASSWORD: "{{ .password }}"
        AUTH_DB_URL: "postgresql://{{ .username }}:{{ .password }}@boutique-postgres:5432/auth_db"
        PRODUCTS_DB_URL: "postgresql://{{ .username }}:{{ .password }}@boutique-postgres:5432/products_db"
        ORDERS_DB_URL: "postgresql://{{ .username }}:{{ .password }}@boutique-postgres:5432/orders_db"
        USERS_DB_URL: "postgresql://{{ .username }}:{{ .password }}@boutique-postgres:5432/users_db"
  dataFrom:
    - extract:
        key: boutique/db
