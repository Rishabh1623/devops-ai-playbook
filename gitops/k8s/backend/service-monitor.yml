apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: boutique-services
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - boutique
  # All 6 backend Services; each names its port `http`
  selector:
    matchExpressions:
      - key: app
        operator: In
        values: [auth, gateway, orders, order-service, product-service, user-service]
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
